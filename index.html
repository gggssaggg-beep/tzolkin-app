<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050010">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Permissions-Policy" content="vibrate=*">
<title>Кин дня — Цолькин</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>window._vibrate = navigator.vibrate ? navigator.vibrate.bind(navigator) : null;</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css?v=75">
</head>
<body>
<canvas id="particles"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<div id="app">
  <header id="nav">
    <button id="prev" class="nav-btn" aria-label="Предыдущий день">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button id="today-btn" class="nav-btn today-btn" aria-label="Сегодня" title="Сегодня">СЕГ</button>
    <div id="date-display" class="date-tap"></div>
    <button id="my-kin-btn" class="nav-btn" aria-label="Мой кин" title="Мой кин">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0" stroke-linecap="round"/></svg>
    </button>
    <button id="next" class="nav-btn" aria-label="Следующий день">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </header>
  <main id="card"></main>

  <nav id="tabs">
    <button class="tab active" data-tab="main" aria-label="Кин">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/></svg></span>КИН</button>
    <button class="tab" data-tab="cycles" aria-label="Циклы">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.6 4.4v3.9h-3.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>ЦИКЛЫ</button>
    <button class="tab" data-tab="tzolkin" aria-label="Цолькин">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><path d="M9 3.5v17M15 3.5v17M3.5 9h17M3.5 15h17"/></svg></span>ЦОЛЬКИН</button>
    <button class="tab" data-tab="personal" aria-label="Мой кин">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0" stroke-linecap="round"/></svg></span>МОЙ</button>
  </nav>
</div>

<button id="music-btn" class="music-btn" aria-label="Фоновая музыка" title="Фоновая музыка">
  <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" /><circle cx="6.5" cy="18" r="2.5" fill="currentColor" stroke="none"/><circle cx="16.5" cy="16" r="2.5" fill="currentColor" stroke="none"/></svg>
</button>
<button id="settings-btn" class="settings-btn" aria-label="Настройки" title="Настройки">
  <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.3-.9-2 3.4L4.6 11a7.7 7.7 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9a7.6 7.6 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.3.9 2-3.4z" stroke-linejoin="round"/></svg>
</button>

<!-- Settings modal -->
<div id="settings-modal" class="modal-overlay" style="display:none">
  <div class="modal-content" id="settings-content"></div>
</div>

<!-- Kin popup (outside #app to avoid stacking context issues) -->
<div id="kin-popup" class="popup-overlay" style="display:none">
  <div class="popup-card" id="kin-popup-content"></div>
</div>

<script>
const APP_VER = '75';
// Reset transient per-version flags (harmless even when served from cache).
if (localStorage.getItem('appVer') !== APP_VER) {
  localStorage.setItem('appVer', APP_VER);
  localStorage.removeItem('vibTested');
}
// ── Silent auto-update ──────────────────────────────────────────────
// The old self-unregister-on-APP_VER trick was a dead end: it lived inside
// index.html, which the old SW served from cache, so it never ran. Instead we
// rely on the SW lifecycle: a new sw.js (its CACHE name bumps every release)
// installs → skipWaiting → activates → claims clients → 'controllerchange'
// fires → we reload once. reg.update() on focus makes an already-open app
// pick up new versions without the user doing anything.
// On localhost we never want a service worker: it caches old builds and makes
// dev show stale content (the classic "works on GitHub, broken on localhost").
// Actively tear down any SW + caches left over from a previous dev session.
const isLocal = ['localhost', '127.0.0.1', '[::1]', ''].includes(location.hostname);
if (isLocal && 'serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
}
if (!isLocal && 'serviceWorker' in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;          // guard against reload loops
    refreshing = true;
    location.reload();
  });
  // The ?v= MUST be bumped every release (together with sw.js CACHE and the
  // app.js/style.css ?v=). The registration URL itself changing is what forces
  // browsers / Telegram WebView / the GitHub Pages CDN to re-fetch sw.js past
  // their HTTP cache — without it, phones keep the old SW and never update.
  navigator.serviceWorker.register('sw.js?v=75').then(reg => {
    reg.update();                     // check for a newer SW right away
    // Re-check whenever the app comes back to the foreground.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update();
    });
  }).catch(() => {});
}
</script>
<script type="module" src="app.js?v=75"></script>
</body>
</html>
