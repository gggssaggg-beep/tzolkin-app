<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050010">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Кин дня — Цолькин</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css?v=18">
</head>
<body>
<canvas id="particles"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<div id="app">
  <!-- TODO: удалить после отладки -->
  <div id="debug-version" style="position:fixed;top:0;left:0;right:0;z-index:999;background:#e94560;color:#fff;text-align:center;font-size:11px;padding:2px;font-family:monospace">v18 neon cosmic — actions deploy</div>
  <header id="nav" style="margin-top:20px">
    <button id="prev" class="nav-btn" aria-label="Previous day">&larr;</button>
    <div id="date-display" class="date-tap"></div>
    <button id="my-kin-btn" class="nav-btn" aria-label="Мой кин" title="Мой кин">☉</button>
    <button id="next" class="nav-btn" aria-label="Next day">&rarr;</button>
  </header>
  <input type="date" id="date-picker" style="display:none">

  <!-- Personal kin modal -->
  <div id="my-kin-modal" class="modal-overlay" style="display:none">
    <div class="modal-content" id="my-kin-content"></div>
  </div>

  <main id="card"></main>

  <nav id="tabs">
    <button class="tab active" data-tab="main"><span class="tab-icon">◉</span>КИН</button>
    <button class="tab" data-tab="cycles"><span class="tab-icon">◌</span>ЦИКЛЫ</button>
    <button class="tab" data-tab="tzolkin"><span class="tab-icon">▦</span>ЦОЛЬКИН</button>
    <button class="tab" data-tab="personal"><span class="tab-icon">☉</span>МОЙ</button>
  </nav>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister());
  });
  caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
  navigator.serviceWorker.register('sw.js');
}
</script>
<script type="module" src="app.js?v=18"></script>
</body>
</html>
